# Snae Player — Docker Compose (контракт: CONTRACTS.md §6)
#
# Запуск без Node/pnpm на хосте:
#   docker compose up --build
#
# Переменные (задаются в окружении или .env рядом с этим файлом):
#   SNAE_PORT — порт плеера в общей network namespace Yggdrasil (по умолчанию 3000)
#   MUSIC_DIR — хостовая директория с музыкой (по умолчанию ./music),
#               монтируется в контейнер read-only как /music

services:
  player:
    build: .
    # Работаем в network namespace Yggdrasil: TUN-интерфейс находится именно там.
    # Порты публиковать не нужно; сервис доступен по IPv6-адресу Yggdrasil.
    network_mode: service:yggdrasil
    depends_on:
      - yggdrasil
    environment:
      # Yggdrasil использует IPv6; "::" также принимает IPv4 healthcheck на localhost.
      HOST: "::"
      PORT: "${SNAE_PORT:-3000}"
      MUSIC_DIR: /music
    volumes:
      # Только чтение: плеер никогда не изменяет файлы библиотеки
      - "${MUSIC_DIR:-/data/music}:/music:ro"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/server-library/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  yggdrasil:
    image: ghcr.io/yggdrasil-network/yggdrasil-go:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./yggdrasil:/etc/yggdrasil-network
